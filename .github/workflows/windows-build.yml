name: Windows Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build WPF app
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "mizedit c#.sln"

      - name: Build
        run: dotnet build "mizedit c#.sln" --configuration Release --no-restore

      - name: Publish
        run: dotnet publish "mizedit.csproj" --configuration Release --output "artifacts/dcs-miz-editor-windows" --no-build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dcs-miz-editor-windows
          path: artifacts/dcs-miz-editor-windows
          if-no-files-found: error
